name: Deploy BCH to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: bch-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy BCH to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY}} 
          script: |
            set -euo pipefail

            APP_DIR="/var/www/BCH"
            BACKUP_DIR="/root/BCH-backups"
            DB_NAME="bch_staging"
            HEALTH_URL="http://127.0.0.1:3002"

            echo "=== BCH automatic deployment started ==="

            mkdir -p "$BACKUP_DIR"

            TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
            BACKUP_FILE="$BACKUP_DIR/${DB_NAME}-before-deploy-${TIMESTAMP}.sql"

            echo "=== PostgreSQL backup ==="
            sudo -u postgres pg_dump "$DB_NAME" > "$BACKUP_FILE"

            echo "=== Sync with GitHub main ==="
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main

            echo "=== Install dependencies ==="
            npm ci

            echo "=== Generate Prisma client ==="
            npx prisma generate

            echo "=== Clean previous build ==="
            rm -rf .next

            echo "=== Build application ==="
            npm run build

            echo "=== Restart BCH ==="
            pm2 restart BCH
            pm2 save

            echo "=== Health check ==="
            sleep 5

            for i in 1 2 3 4 5; do
              if curl --fail --silent --show-error "$HEALTH_URL" > /dev/null; then
                echo "BCH health check passed."
                echo "=== Deployment completed successfully ==="
                exit 0
              fi
              echo "Health check attempt $i failed. Retrying..."
              sleep 3
            done

            echo "ERROR: BCH health check failed."
            echo "Check: pm2 logs BCH --lines 100"
            exit 1
