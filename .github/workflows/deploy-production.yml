name: Deploy BCH to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bch-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bch_ci
          POSTGRES_USER: bch_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bch_ci -d bch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bch_ci@127.0.0.1:5432/bch_ci?schema=public
      INITIAL_SETUP_TOKEN: ci-only-setup-token
      INITIAL_ADMIN_USERNAME: ci-admin
      INITIAL_ADMIN_PASSWORD: ci-only-password-12345
      INITIAL_ADMIN_NAME: CI Admin
      ALLOW_DEMO_SEED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations to CI database
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SERVER_HOST" || { echo "Missing SERVER_HOST" >&2; exit 1; }
          test -n "$SERVER_USER" || { echo "Missing SERVER_USER" >&2; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo "Missing SERVER_SSH_KEY" >&2; exit 1; }

          SERVER_PORT="${SERVER_PORT:-22}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/bch_deploy_key"

          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > "$HOME/.ssh/known_hosts"
          fi

          chmod 600 "$HOME/.ssh/bch_deploy_key" "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/bch_deploy_key" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '/var/www/BCH' && git fetch --prune origin main && git merge --ff-only origin/main && BCH_APP_DIR='/var/www/BCH' BCH_PORT='3002' BCH_PM2_NAME='BCH' BCH_DB_NAME='bch_staging' bash '/var/www/BCH/scripts/deploy-production.sh'"
